name: Build Android APK

# Manual only. Never runs on push/PR, and never uploads to Google Play.
on:
  workflow_dispatch:
    inputs:
      version_name:
        description: Version name shown on the APK (for example 1.0.0)
        required: true
        default: "1.0.0"
      version_code:
        description: Integer version code (increase this every release)
        required: true
        default: "1"
      build_type:
        description: Gradle build type
        type: choice
        options:
          - release
          - debug
        default: release
      publish_github_release:
        description: Attach APK to GitHub Release android-latest (not Google Play)
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: android-apk
  cancel-in-progress: false

jobs:
  build:
    name: Assemble signed APK
    runs-on: ubuntu-latest
    env:
      VERSION_NAME: ${{ inputs.version_name }}
      VERSION_CODE: ${{ inputs.version_code }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          build-root-directory: android

      - name: Configure release signing
        if: inputs.build_type == 'release'
        working-directory: android
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "${ANDROID_KEYSTORE_BASE64:-}" ] || [ -z "${ANDROID_KEYSTORE_PASSWORD:-}" ] || [ -z "${ANDROID_KEY_ALIAS:-}" ] || [ -z "${ANDROID_KEY_PASSWORD:-}" ]; then
            echo "Release signing secrets are missing. Add ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS, and ANDROID_KEY_PASSWORD, then re-run this workflow."
            exit 1
          fi
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > pelbu-release.jks
          cat > keystore.properties <<EOF
          storePassword=$ANDROID_KEYSTORE_PASSWORD
          keyPassword=$ANDROID_KEY_PASSWORD
          keyAlias=$ANDROID_KEY_ALIAS
          storeFile=pelbu-release.jks
          EOF

      - name: Build APK
        working-directory: android
        run: |
          TASK="assembleRelease"
          if [ "${{ inputs.build_type }}" = "debug" ]; then
            TASK="assembleDebug"
          fi
          ./gradlew "$TASK" --no-daemon \
            -PVERSION_NAME="${VERSION_NAME}" \
            -PVERSION_CODE="${VERSION_CODE}" \
            -PLMS_URL="https://pelbu.bt" \
            -PLMS_HOST="pelbu.bt"

      - name: Stage APK
        id: apk
        run: |
          set -euo pipefail
          if [ "${{ inputs.build_type }}" = "debug" ]; then
            APK_DIR="android/app/build/outputs/apk/debug"
          else
            APK_DIR="android/app/build/outputs/apk/release"
          fi
          if [ ! -d "$APK_DIR" ]; then
            echo "APK output directory not found: $APK_DIR" >&2
            echo "The Gradle build did not produce the expected output directory." >&2
            exit 1
          fi
          SRC="$(find "$APK_DIR" -name "*.apk" -type f | head -n 1 || true)"
          if [ -z "$SRC" ] || [ ! -f "$SRC" ]; then
            echo "No APK found in $APK_DIR" >&2
            echo "Directory contents:" >&2
            ls -la "$APK_DIR" >&2 || true
            exit 1
          fi
          mkdir -p dist
          cp "$SRC" dist/pelbu-lms.apk
          echo "path=dist/pelbu-lms.apk" >> "$GITHUB_OUTPUT"
          echo "Built $(du -h dist/pelbu-lms.apk | cut -f1) APK from $SRC"

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: pelbu-lms-${{ inputs.version_name }}
          path: dist/pelbu-lms.apk
          if-no-files-found: error

      - name: Publish GitHub Release
        if: inputs.publish_github_release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          APK="dist/pelbu-lms.apk"
          VERSION_TAG="android-v${VERSION_NAME}"
          NOTES="$(cat <<EOF
          Pelbu LMS Android APK ${VERSION_NAME} (${VERSION_CODE}).

          Sideload from the website download page. This workflow does not publish to Google Play.
          EOF
          )"
          if gh release view "$VERSION_TAG" >/dev/null 2>&1; then
            gh release upload "$VERSION_TAG" "$APK" --clobber
          else
            gh release create "$VERSION_TAG" "$APK" --title "Pelbu Android ${VERSION_NAME}" --notes "$NOTES"
          fi
          if gh release view android-latest >/dev/null 2>&1; then
            gh release upload android-latest "$APK" --clobber
            gh release edit android-latest --notes "$NOTES"
          else
            gh release create android-latest "$APK" --title "Pelbu Android (latest)" --notes "$NOTES" --latest=false
          fi
