<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Rigbu — Offline</title>
  <style>
    body {
      font-family: "Plus Jakarta Sans", system-ui, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      background: #FAF7F2;
      color: #1B2433;
    }
    .offline-container {
      text-align: center;
      padding: 2rem;
      max-width: 24rem;
    }
    img {
      width: 160px;
      height: auto;
      margin: 0 auto 1rem;
    }
    h1 {
      font-size: 1.5rem;
      margin: 0 0 0.75rem;
    }
    p {
      font-size: 1rem;
      line-height: 1.5;
      color: #34446A;
      margin: 0 0 0.75rem;
    }
  </style>
</head>
<body>
  <div class="offline-container">
    <img src="/brand/mascot/rigbu-owl-sleepy.svg" width="160" height="160" alt="Rigbu resting">
    <h1>You’re offline</h1>
    <p>Check your connection, then try again. Rigbu will be here when you’re back.</p>
  </div>
</body>
</html>
